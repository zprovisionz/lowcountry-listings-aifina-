<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <style>
      /* Critical: prevent FOUC — match landing --bg */
      html { background: #0b0f14; }
      #root { opacity: 0; animation: rootFadeIn .4s .1s ease forwards; }
      @keyframes rootFadeIn { to { opacity: 1; } }
    </style>
